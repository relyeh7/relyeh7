version: "3.8"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  data:
    build: .
    command: python -m services.data.service
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  risk:
    build: .
    command: python -m services.risk.service
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis, os; r = redis.from_url(os.getenv('REDIS_URL', 'redis://redis:6379')); r.ping()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  sltp:
    build: .
    command: python -m services.sltp.manager
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  executor:
    build: .
    command: python -m services.executor.crypto.service
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      risk:
        condition: service_healthy

  performance:
    build: .
    command: python -m services.performance.tracker
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  positions:
    build: .
    command: python -m services.positions.manager
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  orchestrator:
    build: .
    command: python -m services.orchestrator.service
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  execution_bridge:
    build: .
    command: python -m services.execution_bridge.bridge
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  notifications:
    build: .
    command: python -m services.notifications.alerts
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build: .
    command: uvicorn services.dashboard.api.main:app --host 0.0.0.0 --port 8080
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
